name: Generate and Execute Playwright Tests

on:
  workflow_run:
    workflows:
      - "Generate Test Cases"
    types:
      - completed
permissions:
contents: write

jobs:
generate-playwright:

```
# Run only if the first pipeline succeeded
if: github.event.workflow_run.conclusion == 'success'

runs-on: ubuntu-latest

steps:

  # ------------------------------------------
  # STEP 1: CHECKOUT LATEST CODE
  # ------------------------------------------

  - name: Checkout Repository
    uses: actions/checkout@v4
    with:
      ref: main


  # ------------------------------------------
  # STEP 2: SETUP PYTHON
  # ------------------------------------------

  - name: Setup Python
    uses: actions/setup-python@v5
    with:
      python-version: '3.13'


  # ------------------------------------------
  # STEP 3: INSTALL PYTHON DEPENDENCIES
  # ------------------------------------------

  - name: Install Python Dependencies
    run: |
      python -m pip install --upgrade pip
      pip install ollama playwright


  # ------------------------------------------
  # STEP 4: INSTALL OLLAMA
  # ------------------------------------------

  - name: Install Ollama
    run: |
      curl -fsSL https://ollama.com/install.sh | sh


  # ------------------------------------------
  # STEP 5: RESTORE OLLAMA MODEL CACHE
  # ------------------------------------------

  - name: Restore Ollama Model Cache
    uses: actions/cache@v4
    with:
      path: ~/.ollama/models
      key: ollama-llama3.2-v1


  # ------------------------------------------
  # STEP 6: START OLLAMA
  # ------------------------------------------

  - name: Start Ollama
    run: |
      ollama serve &
      sleep 10


  # ------------------------------------------
  # STEP 7: CHECK / PULL LLAMA MODEL
  # ------------------------------------------

  - name: Check and Pull Llama Model
    run: |
      if ollama list | grep -q "llama3.2"; then
        echo "llama3.2 model already available."
      else
        echo "Downloading llama3.2..."
        ollama pull llama3.2
      fi


  # ------------------------------------------
  # STEP 8: INSTALL PLAYWRIGHT BROWSER
  # ------------------------------------------

  - name: Install Playwright Chromium
    run: |
      playwright install chromium --with-deps


  # ------------------------------------------
  # STEP 9: RUN AUTOMATION AGENT
  # ------------------------------------------

  - name: Generate Playwright Scripts
    env:
      APP_URL: ${{ secrets.APP_URL }}
    run: |
      python agents/agent_generate_scripts.py


  # ------------------------------------------
  # STEP 10: SETUP NODE
  # ------------------------------------------

  - name: Setup Node.js
    uses: actions/setup-node@v4
    with:
      node-version: '20'


  # ------------------------------------------
  # STEP 11: INSTALL PLAYWRIGHT TEST
  # ------------------------------------------

  - name: Install Node Dependencies
    run: |
      npm install


  # ------------------------------------------
  # STEP 12: EXECUTE GENERATED TESTS
  # ------------------------------------------

  - name: Execute Playwright Tests
    env:
      APP_URL: ${{ secrets.APP_URL }}
    run: |
      npx playwright test
    continue-on-error: true


  # ------------------------------------------
  # STEP 13: UPLOAD PLAYWRIGHT REPORT
  # ------------------------------------------

  - name: Upload Playwright Report
    uses: actions/upload-artifact@v4
    if: always()
    with:
      name: playwright-report
      path: playwright-report/
      retention-days: 7


  # ------------------------------------------
  # STEP 14: COMMIT GENERATED FILES
  # ------------------------------------------

  - name: Commit Generated Playwright Files
    if: always()
    run: |

      git config user.name "github-actions"

      git config user.email "github-actions@github.com"


      git add generated/


      if ! git diff --cached --quiet; then

        git commit -m "Generate Playwright automation scripts"

        git push

      else

        echo "No generated file changes to commit."

      fi
```
